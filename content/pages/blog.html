{% extends "base.html" %}
{% block content %}
<h2><span class="shell-prompt">~</span> posts</h2>
<ul class="posts padded-list">
    {% for path, post in posts %}
    <li>
        <a href="{{path}}">{{post.title}}</a> - <span class="date">{{post.date}}</span>
    </li>
    {% endfor %}
</ul>
{% endblock %}
